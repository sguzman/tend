name: Generate Tend Nix inputs (one-time)
on:
  push:
    branches: ["tend/branding"]
    paths: [".github/workflows/pin-flake-lock.yml"]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Lock flake inputs
        run: nix flake lock
      - name: Generate crate2nix file using the full Cargo workspace
        run: nix develop --command crate2nix generate -f Cargo.toml -o Cargo.nix
      - name: Commit generated Nix inputs
        shell: bash
        run: |
          git add flake.lock Cargo.nix
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "nix: commit per-crate Cargo.nix graph"
            git push origin HEAD:refs/heads/tend/branding
          fi
